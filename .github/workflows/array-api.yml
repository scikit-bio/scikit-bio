name: Array API Compatibility

on:
  pull_request:
    branches: [main]
    paths-ignore: ["web/**", "**.md", "README.rst"]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC

env:
  latest_python: "3.14"

permissions:
  contents: read

jobs:
  test-cpu:
    name: Array API (${{ matrix.backend }}, cpu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [torch, jax]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.latest_python }}

      - name: Install scikit-bio + backend
        run: |
          pip install .
          case "${{ matrix.backend }}" in
            torch) pip install torch --index-url https://download.pytorch.org/whl/cpu ;;
            jax)   pip install -U jax ;;
          esac
          pip install -r ci/requirements.txt -r ci/requirements.test.txt

      - name: Run tests
        env:
          SKBIO_ARRAY_BACKEND: ${{ matrix.backend }}
          SKBIO_DEVICE: cpu
        run: cd ci && coverage run --rcfile ../pyproject.toml -m pytest -m array_api --pyargs skbio

      - name: Generate coverage reports
        run: cd ci && coverage lcov --rcfile ../pyproject.toml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: scikit-bio/scikit-bio