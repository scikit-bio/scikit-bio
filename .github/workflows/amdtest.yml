name: AMD

on:
  workflow_dispatch:
  # pull_request:
  #   branches: [ main ]
  #   paths-ignore: ["web/**", "**.md", "README.rst"]

permissions:
  contents: read

jobs:
  test-amd:
    name: Test on AMD GPU
    runs-on: [self-hosted, linux, x64, azure-gpu-v710]
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: true
    steps:
      - name: Check AMD GPU
        run: |
          amd-smi
          rocminfo
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: 3.14
          environment-file: ci/conda_host_env.yml
      - name: Install dependencies
        run: |
          conda install -q --yes -c conda-forge --file ci/requirements.txt --file ci/requirements.test.txt
          python -m ensurepip
          pip install --no-deps .
          conda list
      - name: Install optional dependencies
        run: |
          pip install anndata polars
          conda list
      - name: Install ROCm PyTorch
        run: pip install torch==2.15.0+rocm10.0 --index-url https://download.pytorch.org/whl/rocm10.0
      - name: Verify PyTorch can use the AMD GPU
        run: |
          python - <<'PY'
          import torch

          assert torch.version.hip is not None, "PyTorch is not a ROCm build"
          assert torch.cuda.is_available(), "PyTorch cannot access the GPU"
          print("torch:", torch.__version__, "ROCm:", torch.version.hip,
                "device:", torch.cuda.get_device_name(0))
          result = torch.tensor([1.0, 2.0], device="cuda") * 2
          assert result.cpu().tolist() == [2.0, 4.0]
          PY
      - name: Run unit tests
        run: make test
      - name: Run GPU array API smoke tests
        env:
          SKBIO_ARRAY_BACKEND: torch
          SKBIO_DEVICE: cuda
        run: |
          cd ci && pytest -q --pyargs \
            skbio.stats.composition.tests.test_base::CompositionTests::test_closure_backends \
            skbio.stats.composition.tests.test_base::CompositionTests::test_clr_backends
