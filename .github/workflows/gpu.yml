name: GPU CI

# This workflow runs the GPU tests on the Azure GPU VM. A separate workflow, "Azure VM
# Start", launches the VM at the same time, while the current workflow is queued and
# will run when the VM is launched. Upon completion, another workflow, "Azure VM Stop"
# will be triggered to shut down the VM.

on:
  pull_request:
    branches: [main]
    types: [labeled]
    paths-ignore: ["web/**", "**.md", "README.rst"]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC

# Ensure that only one GPU workflow runs at a time, because we have only one GPU VM.
concurrency:
  group: azure-gpu
  queue: max

env:
  latest_python: "3.14"

permissions:
  contents: read

jobs:
  test-gpu:
    name: Array API (${{ matrix.backend }}, cuda, ${{ matrix.numba }})
    if: |
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'gpu-ci') ||
      (github.event_name != 'pull_request' &&
       github.ref == 'refs/heads/main')

    # GitHub's own GPU runner:
    # runs-on: gpu-t4-4-core

    # Azure's GPU runner (NC4as T4 v3)
    runs-on: [self-hosted, linux, x64, azure-gpu-t4]
    strategy:
      fail-fast: false

      # Our GPU VM has just one GPU, and 16 GB VRAM, so let's not run multiple jobs
      # with different backends at the same time.
      max-parallel: 1

      # numba-cuda-mlir is the maintained Numba GPU layer. numba-cuda is deprecated
      # and does not support NumPy 2.5; its jobs keep the older installations
      # working. JAX has no Numba GPU path, so it runs once.
      matrix:
        include:
          - backend: torch
            device: cuda
            numba: numba-cuda-mlir
          - backend: jax
            device: cuda
            numba: numba-cuda-mlir
          - backend: cupy
            device: cuda
            numba: numba-cuda-mlir
          - backend: torch
            device: cuda
            numba: numba-cuda
          - backend: cupy
            device: cuda
            numba: numba-cuda
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.latest_python }}

      - name: Check CUDA driver
        run: nvidia-smi

      - name: Install scikit-bio + backend
        # CUDA 12 is pinned for the libraries. To update CUDA versions check the
        # installation guides for each package.
        run: |
          python -m ensurepip
          pip install -v .
          case "${{ matrix.backend }}" in
            torch) pip install torch --index-url https://download.pytorch.org/whl/cu128 ;;
            jax)   pip install -U "jax[cuda12]" ;;
            cupy)  pip install cupy-cuda12x[ctk] ;;
          esac
          pip install -r ci/requirements.txt -r ci/requirements.test.txt
          # The Numba GPU layer is what lets the fused GPU kernels actually run
          # here. numba-cuda-mlir does not bring in numba itself, which
          # `engine="numba"` needs to resolve.
          case "${{ matrix.numba }}" in
            numba-cuda-mlir) pip install numba "numba-cuda-mlir[cu12]" ;;
            numba-cuda)      pip install "numba-cuda[cu12]" "numpy<2.5" ;;
          esac

      - name: Verify GPU is visible to backend
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          python - <<'PY'
          import os
          backend = os.environ["BACKEND"]
          if backend == "torch":
              import torch
              assert torch.cuda.is_available(), "torch installed without CUDA"
              print("torch:", torch.__version__, "CUDA:", torch.version.cuda,
                    "device:", torch.cuda.get_device_name(0))
          elif backend == "jax":
              import jax
              gpus = jax.devices("gpu")
              assert gpus, "jax sees no GPU"
              print("jax:", jax.__version__, "devices:", gpus)
          elif backend == "cupy":
              import cupy
              n = cupy.cuda.runtime.getDeviceCount()
              assert n > 0, "cupy sees no GPU"
              print("cupy:", cupy.__version__, "devices:", n)
          PY

      - name: Verify Numba can target the GPU
        # Without this the job still passes when the Numba GPU layer is missing or
        # cannot find NVVM: the fused kernel is simply skipped and every test takes
        # the array-API fallback, so the GPU kernels would look tested when they
        # were never run. A kernel that fails to build is caught by the warning
        # filter in the test step instead.
        env:
          NUMBA_GPU: ${{ matrix.numba }}
        run: |
          python - <<'PY'
          import os
          if os.environ["NUMBA_GPU"] == "numba-cuda-mlir":
              from numba_cuda_mlir import cuda
          else:
              from numba import cuda
          assert cuda.is_available(), "Numba cannot target this GPU"
          print(os.environ["NUMBA_GPU"], "devices:", cuda.gpus)
          PY

      - name: Run tests
        # The dispatchers catch a kernel failure, warn once and fall back, which
        # passes every test. Turning that warning into an error makes the job
        # fail when a kernel did not run.
        env:
          SKBIO_ARRAY_BACKEND: ${{ matrix.backend }}
          SKBIO_DEVICE: ${{ matrix.device }}
        run: |
          cd ci && coverage run --rcfile ../pyproject.toml -m pytest -m array_api --pyargs skbio \
            -W "error:The Numba GPU kernel could not be used:UserWarning"

      - name: Generate coverage reports
        run: cd ci && coverage lcov --rcfile ../pyproject.toml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: scikit-bio/scikit-bio