name: Azure GPU Lifecycle Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-gpu-lifecycle
  cancel-in-progress: false

jobs:
  start-gpu-vm:
    name: Start Azure GPU VM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Log in to Azure using OIDC
        uses: azure/login@v3
        with:
          auth-type: IDENTITY_PROVIDER
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Start VM
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.AZURE_VM_NAME }}
        run: |
          az vm start \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME"

          az vm get-instance-view \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus" \
            --output tsv

  gpu-smoke:
    name: Verify T4 runner
    needs: start-gpu-vm
    runs-on: [self-hosted, linux, x64, azure-gpu-t4]
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check GPU
        run: |
          nvidia-smi
          nvidia-smi \
            --query-gpu=name,driver_version,memory.total \
            --format=csv,noheader

  stop-gpu-vm:
    name: Deallocate Azure GPU VM
    needs: [start-gpu-vm, gpu-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Log in to Azure using OIDC
        uses: azure/login@v3
        with:
          auth-type: IDENTITY_PROVIDER
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deallocate VM
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.AZURE_VM_NAME }}
        run: |
          az vm deallocate \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME"

          az vm get-instance-view \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus" \
            --output tsv
